<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Redestab-Timer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #1C1C1A;
    display: flex;
    flex-direction: column;
  }

  /* ---------- SETUP-ANSICHT ---------- */
  #setup {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
    background: #F4F1EA;
    color: #2C2C2A;
  }
  #setup h1 {
    font-size: 20px;
    font-weight: 500;
    text-align: center;
    margin: 0 0 28px;
  }
  .setup-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 4px;
    border-bottom: 1px solid #D3D1C7;
  }
  .setup-row:last-of-type { border-bottom: none; }
  .setup-row .setup-label { font-size: 16px; font-weight: 500; }
  .setup-controls { display: flex; align-items: center; gap: 14px; }
  .setup-controls button {
    width: 44px; height: 44px; padding: 0; font-size: 22px;
    border-radius: 10px; border: 1px solid #D3D1C7; background: #fff; cursor: pointer;
  }
  .setup-controls button:active { transform: scale(0.95); }
  .setup-out { font-size: 18px; font-weight: 500; min-width: 74px; text-align: center; }

  #start-btn {
    margin-top: 28px;
    width: 100%;
    padding: 18px;
    font-size: 18px;
    font-weight: 500;
    border-radius: 12px;
    border: none;
    background: #2C2C2A;
    color: #fff;
    cursor: pointer;
  }
  #start-btn:active { transform: scale(0.98); }

  /* ---------- LIVE-ANSICHT ---------- */
  #live {
    display: none;
    flex: 1;
    flex-direction: column;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    color: #B4B2A9;
    font-size: 13px;
  }
  .top-bar button {
    background: none;
    border: none;
    color: #B4B2A9;
    font-size: 20px;
    padding: 8px;
    cursor: pointer;
  }
  #remaining-out { font-size: 14px; font-weight: 500; color: #fff; }

  .speaker-half {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    padding: 8px;
  }
  #live-a { background: #4A1B0C; transform: rotate(180deg); }
  #live-b { background: #04342C; }
  #live-a.active { background: #D85A30; }
  #live-b.active { background: #1D9E75; }

  .live-name { font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.85); }
  .live-time { font-size: 88px; font-weight: 500; color: #fff; font-variant-numeric: tabular-nums; line-height: 1; }
  .live-status { font-size: 14px; color: rgba(255,255,255,0.65); min-height: 18px; }

  .diff-badge {
    font-size: 26px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    padding: 4px 16px;
    border-radius: 999px;
    line-height: 1.3;
  }
  .diff-under { background: rgba(255,255,255,0.14); color: rgba(255,255,255,0.75); }
  .diff-over { background: #F09595; color: #501313; }

  .own-progress {
    width: 78%;
    max-width: 320px;
    height: 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
    margin-top: 4px;
  }
  .own-progress-fill { height: 100%; background: rgba(255,255,255,0.55); transition: width 0.2s, background 0.2s; }
  .own-progress-fill.over { background: #F09595; }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1C1C1A;
    padding: 6px 0;
  }
  .divider i { font-size: 20px; color: #5F5E5A; }
</style>
</head>
<body>

<div id="setup">
  <h1>Redestab-Timer</h1>

  <div class="setup-row">
    <span class="setup-label">Gesamtziel</span>
    <div class="setup-controls">
      <button id="goal-minus" aria-label="Gesamtziel verringern">-</button>
      <span id="goal-out" class="setup-out">20 min</span>
      <button id="goal-plus" aria-label="Gesamtziel erhöhen">+</button>
    </div>
  </div>

  <div class="setup-row">
    <span class="setup-label">Ziel Person A</span>
    <div class="setup-controls">
      <button id="own-a-minus" aria-label="Ziel Person A verringern">-</button>
      <span id="own-a-out" class="setup-out">10 min</span>
      <button id="own-a-plus" aria-label="Ziel Person A erhöhen">+</button>
    </div>
  </div>

  <div class="setup-row">
    <span class="setup-label">Ziel Person B</span>
    <div class="setup-controls">
      <button id="own-b-minus" aria-label="Ziel Person B verringern">-</button>
      <span id="own-b-out" class="setup-out">10 min</span>
      <button id="own-b-plus" aria-label="Ziel Person B erhöhen">+</button>
    </div>
  </div>

  <button id="start-btn"><i class="ti ti-player-play" style="font-size:18px; vertical-align:-3px; margin-right:6px;" aria-hidden="true"></i>Sitzung starten</button>
</div>

<div id="live">
  <div class="top-bar">
    <button id="back-btn" aria-label="Zurück zu Einstellungen"><i class="ti ti-settings" aria-hidden="true"></i></button>
    <span id="remaining-out">20:00 verbleibend</span>
    <button id="pause-btn" aria-label="Pause"><i class="ti ti-player-pause" aria-hidden="true"></i></button>
  </div>

  <button id="live-a" class="speaker-half">
    <span class="live-name">Person A</span>
    <span id="time-a" class="live-time">00:00</span>
    <span id="diff-a" class="diff-badge diff-under">Ziel 10:00</span>
    <div class="own-progress"><div id="own-progress-a" class="own-progress-fill" style="width:0%"></div></div>
    <span id="status-a" class="live-status">Zum Starten tippen</span>
  </button>

  <div class="divider"><i class="ti ti-arrows-vertical" aria-hidden="true"></i></div>

  <button id="live-b" class="speaker-half">
    <span class="live-name">Person B</span>
    <span id="time-b" class="live-time">00:00</span>
    <span id="diff-b" class="diff-badge diff-under">Ziel 10:00</span>
    <div class="own-progress"><div id="own-progress-b" class="own-progress-fill" style="width:0%"></div></div>
    <span id="status-b" class="live-status">Zum Starten tippen</span>
  </button>
</div>

<script>
(function(){
  var secA = 0, secB = 0, active = null, goalMin = 20;
  var ownGoalA = 10, ownGoalB = 10;
  var timer = null;

  var setupView = document.getElementById('setup');
  var liveView = document.getElementById('live');

  var goalOut = document.getElementById('goal-out');
  var ownAOut = document.getElementById('own-a-out');
  var ownBOut = document.getElementById('own-b-out');

  var elA = document.getElementById('time-a');
  var elB = document.getElementById('time-b');
  var statusA = document.getElementById('status-a');
  var statusB = document.getElementById('status-b');
  var diffA = document.getElementById('diff-a');
  var diffB = document.getElementById('diff-b');
  var progA = document.getElementById('own-progress-a');
  var progB = document.getElementById('own-progress-b');
  var liveA = document.getElementById('live-a');
  var liveB = document.getElementById('live-b');
  var remOut = document.getElementById('remaining-out');
  var pauseBtn = document.getElementById('pause-btn');

  function fmt(s){
    var m = Math.floor(s/60);
    var r = s%60;
    return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;
  }

  function render(){
    elA.textContent = fmt(secA);
    elB.textContent = fmt(secB);

    var goalSec = goalMin*60;
    var remaining = Math.max(0, goalSec-(secA+secB));
    remOut.textContent = fmt(remaining)+' verbleibend';
    remOut.style.color = (remaining===0 && goalSec>0) ? '#F09595' : '#fff';
    if(remaining===0 && goalSec>0){
      remOut.textContent = 'Zielzeit erreicht';
    }

    liveA.classList.toggle('active', active==='a');
    liveB.classList.toggle('active', active==='b');

    var ownGoalASec = ownGoalA*60, ownGoalBSec = ownGoalB*60;
    var overA = ownGoalASec>0 && secA>=ownGoalASec;
    var overB = ownGoalBSec>0 && secB>=ownGoalBSec;

    updateDiffBadge(diffA, progA, secA, ownGoalASec, overA);
    updateDiffBadge(diffB, progB, secB, ownGoalBSec, overB);

    if(active==='a'){
      statusA.textContent = overA ? 'Eigenes Ziel überschritten' : 'Spricht gerade';
    } else {
      statusA.textContent = secA>0 ? 'Pausiert' : 'Zum Starten tippen';
    }
    if(active==='b'){
      statusB.textContent = overB ? 'Eigenes Ziel überschritten' : 'Spricht gerade';
    } else {
      statusB.textContent = secB>0 ? 'Pausiert' : 'Zum Starten tippen';
    }
  }

  function updateDiffBadge(badgeEl, progEl, sec, goalSec, isOver){
    if(goalSec<=0){
      badgeEl.textContent = '–';
      badgeEl.className = 'diff-badge diff-under';
      progEl.style.width = '0%';
      progEl.classList.remove('over');
      return;
    }
    if(isOver){
      badgeEl.textContent = '+ '+fmt(sec-goalSec);
      badgeEl.className = 'diff-badge diff-over';
      progEl.classList.add('over');
      progEl.style.width = '100%';
    } else {
      badgeEl.textContent = 'noch '+fmt(goalSec-sec);
      badgeEl.className = 'diff-badge diff-under';
      progEl.classList.remove('over');
      progEl.style.width = Math.min(100, sec/goalSec*100)+'%';
    }
  }

  function tick(){
    if(active==='a') secA++;
    if(active==='b') secB++;
    render();
  }

  function startStop(who){
    if(active===who){
      active = null;
      clearInterval(timer);
    } else {
      active = who;
      clearInterval(timer);
      timer = setInterval(tick, 1000);
    }
    render();
  }

  liveA.addEventListener('click', function(){ startStop('a'); });
  liveB.addEventListener('click', function(){ startStop('b'); });

  pauseBtn.addEventListener('click', function(e){
    e.stopPropagation();
    active = null;
    clearInterval(timer);
    render();
  });

  document.getElementById('back-btn').addEventListener('click', function(){
    active = null;
    clearInterval(timer);
    secA = 0; secB = 0;
    liveView.style.display = 'none';
    setupView.style.display = 'flex';
    render();
  });

  document.getElementById('start-btn').addEventListener('click', function(){
    secA = 0; secB = 0; active = null;
    setupView.style.display = 'none';
    liveView.style.display = 'flex';
    render();
  });

  function refreshSetupLabels(){
    goalOut.textContent = goalMin+' min';
    ownAOut.textContent = ownGoalA+' min';
    ownBOut.textContent = ownGoalB+' min';
  }

  // Gesamtziel ändern -> A und B proportional mitskalieren
  function setTotal(newTotal){
    newTotal = Math.max(2, newTotal);
    var oldTotal = ownGoalA + ownGoalB;
    if(oldTotal <= 0){
      ownGoalA = Math.round(newTotal/2);
      ownGoalB = newTotal - ownGoalA;
    } else {
      ownGoalA = Math.max(1, Math.round(ownGoalA * newTotal / oldTotal));
      ownGoalB = Math.max(1, newTotal - ownGoalA);
    }
    goalMin = ownGoalA + ownGoalB;
    refreshSetupLabels();
  }

  // Ziel A ändern -> Ziel B hält die Differenz zum Gesamtziel
  function setOwnA(newA){
    newA = Math.max(1, newA);
    ownGoalA = newA;
    ownGoalB = Math.max(1, goalMin - ownGoalA);
    goalMin = ownGoalA + ownGoalB;
    refreshSetupLabels();
  }

  // Ziel B ändern -> Ziel A hält die Differenz zum Gesamtziel
  function setOwnB(newB){
    newB = Math.max(1, newB);
    ownGoalB = newB;
    ownGoalA = Math.max(1, goalMin - ownGoalB);
    goalMin = ownGoalA + ownGoalB;
    refreshSetupLabels();
  }

  document.getElementById('goal-minus').addEventListener('click', function(){ setTotal(goalMin-1); });
  document.getElementById('goal-plus').addEventListener('click', function(){ setTotal(goalMin+1); });
  document.getElementById('own-a-minus').addEventListener('click', function(){ setOwnA(ownGoalA-1); });
  document.getElementById('own-a-plus').addEventListener('click', function(){ setOwnA(ownGoalA+1); });
  document.getElementById('own-b-minus').addEventListener('click', function(){ setOwnB(ownGoalB-1); });
  document.getElementById('own-b-plus').addEventListener('click', function(){ setOwnB(ownGoalB+1); });

  render();
})();
</script>

</body>
</html>
