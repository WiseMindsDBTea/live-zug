<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ed"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Geräusche"><link rel="manifest" href="manifest.webmanifest"><title>Olivias Geräusche</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8ed;color:#25221f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px)}main{max-width:760px;margin:auto}h1{font-size:32px;margin:0 0 5px}.sub{color:#6f675e;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{appearance:none;border:0;background:white;border-radius:28px;min-height:220px;padding:20px;box-shadow:0 4px 18px #5d493b12;display:flex;flex-direction:column;align-items:center;justify-content:center;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.card:active{transform:scale(.97);background:#fffdf9}.emoji{font-size:92px;line-height:1}.name{font-size:20px;font-weight:800;margin-top:15px}.hint{font-size:13px;color:#81786e;margin-top:6px}.status{text-align:center;min-height:28px;padding:11px 0;font-weight:750}.about{font-size:12px;color:#82786e;line-height:1.45;margin-top:22px}@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:360px){.grid{grid-template-columns:1fr}.card{min-height:200px}}</style></head><body><main><h1>🔊 Olivias Geräusche</h1><p class="sub">Tippe auf ein Bild, um das Geräusch zu hören.</p><div class="grid"><button class="card" id="apple" type="button" aria-label="Apfel abbeißen abspielen"><div class="emoji">🍎</div><div class="name">Apfel abbeißen</div><div class="hint">Antippen → KNACK!</div></button></div><div class="status" id="status" aria-live="polite"></div><audio id="appleSound" src="apple-bite.m4a" preload="auto" playsinline></audio><p class="about">Version 0.3.0 · Web-App für iPhone · Apfelbiss CC0.</p><script>const a=document.getElementById('appleSound'),s=document.getElementById('status'),b=document.getElementById('apple');b.addEventListener('click',async()=>{try{a.pause();a.currentTime=0;await a.play();s.textContent='🍎 KNACK!';setTimeout(()=>s.textContent='',900)}catch(e){s.textContent='Ton konnte nicht gestartet werden – bitte erneut tippen.'}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></main></body></html>
