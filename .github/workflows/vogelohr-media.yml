name: Vogelohr – Medien bauen

on:
  push:
    branches: [main]
    paths:
      - "vogelstimmen/tools/**"
      - ".github/workflows/vogelohr-media.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Nur diese IDs (kommagetrennt)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: vogelohr-media
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q requests numpy pillow
      - name: Medien holen, verarbeiten und schrittweise committen
        working-directory: vogelstimmen/tools
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          git config user.name "vogelohr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit() {
            cd "$GITHUB_WORKSPACE"
            git add vogelstimmen/media vogelstimmen/media.json vogelstimmen/tools/media-report.txt 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "Vogelohr: Medien ($1) [skip ci]"
              for i in 1 2 3; do git pull --rebase -q -X ours origin main && git push -q origin HEAD:main && break; sleep 5; done
            fi
            cd - >/dev/null
          }
          ONLY_IDS="$ONLY"
          if [ -z "$ONLY_IDS" ] && [ -f rebuild.txt ]; then ONLY_IDS="$(tr -d ' \n' < rebuild.txt)"; fi
          if [ -n "$ONLY_IDS" ]; then
            python build_media.py --only "$ONLY_IDS"; commit "nachgebessert"
          else
            for k in 1 2 3 4 5; do python build_media.py --limit 24; commit "Teil $k"; done
          fi
