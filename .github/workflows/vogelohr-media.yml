name: Vogelohr – Medien bauen

on:
  push:
    branches: [main]
    paths:
      - "vogelstimmen/tools/**"
      - ".github/workflows/vogelohr-media.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Nur diese IDs (kommagetrennt)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: vogelohr-media
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q requests numpy pillow
      - name: Medien holen und verarbeiten
        working-directory: vogelstimmen/tools
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          ONLY_IDS="$ONLY"
          if [ -z "$ONLY_IDS" ] && [ -f rebuild.txt ]; then ONLY_IDS="$(tr -d ' \n' < rebuild.txt)"; fi
          if [ -n "$ONLY_IDS" ]; then python build_media.py --only "$ONLY_IDS"; else python build_media.py; fi
      - name: Ergebnis committen
        run: |
          git config user.name "vogelohr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vogelstimmen/media vogelstimmen/media.json vogelstimmen/tools/media-report.txt
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Vogelohr: Medien aktualisiert [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
